# 压测哪家官方客户端：vllm 或 sglang。服务需事先启动。
backend: vllm

base_url: http://127.0.0.1:8000
model: Qwen/Qwen3-8B
# API 上的模型名与 tokenizer 路径不同时再填。
served_model_name: null
tokenizer: Qwen/Qwen3-8B

vllm_executable: vllm
sglang_python: python

# 官方 --backend。不填时 vLLM 用 vllm，SGLang 用 sglang-oai。
# official_backend: sglang-oai
# 官方 --dataset-name。不填时 vLLM 用 random，SGLang 用 random-ids。
# dataset_name: random
# 官方 --random-range-ratio。不填时 vLLM 用 0，SGLang 用 1。
# random_range_ratio: 0

num_prompts: 100
concurrency: [1, 4, 8, 16, 32, 64, 128]
input_output:
  - input_len: 512
    output_len: 512
  - input_len: 4096
    output_len: 1024
  - input_len: 16384
    output_len: 1024

seed: 1
# null 表示不传该参数，沿用官方默认（一次提交全部请求）。
request_rate: null
ignore_eos: true
keep_raw_results: true

# 原样追加到官方命令末尾。
extra_args: []
